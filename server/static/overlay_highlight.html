<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chat Highlight Overlay</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        yt: '#FF0000',
                        tt: '#00F2FE',
                        tiktok: '#00F2FE',
                        accent: '#8B5CF6'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        :root {
            --ui-scale: 1;
        }

        body {
            background-color: transparent !important;
            color: #fff;
            overflow: hidden;
            display: flex;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 2rem;
            box-sizing: border-box;
        }

        /* Positions */
        body.pos-top {
            align-items: flex-start;
            justify-content: center;
            padding-top: 4vh;
        }
        body.pos-center {
            align-items: center;
            justify-content: center;
        }
        body.pos-bottom {
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 6vh;
        }

        .highlight-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            transform-origin: center center;
            zoom: var(--ui-scale);
        }

        body.pos-top .highlight-wrapper { transform-origin: top center; }
        body.pos-bottom .highlight-wrapper { transform-origin: bottom center; }

        .highlight-card {
            animation: show 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            background: rgba(12, 12, 16, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.85), 0 0 35px rgba(0, 0, 0, 0.4);
            border-radius: 1.75rem;
            max-width: 95%;
            width: 880px;
        }

        .highlight-card.hide {
            animation: hide 0.35s cubic-bezier(0.4, 0, 1, 1) forwards;
        }

        /* Text outline / shadow for maximum legibility */
        .text-glow {
            text-shadow: 0 2px 10px rgba(0,0,0,0.85), 0 1px 3px rgba(0,0,0,0.9);
        }

        @keyframes show {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes hide {
            from {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
        }

        /* Auto-boost size in Portrait (9:16 vertical stream like TikTok / Reels / Shorts) */
        @media (max-aspect-ratio: 1/1), (orientation: portrait) {
            :root {
                --ui-scale: 1.45;
            }
            body.pos-top {
                padding-top: 5vh;
            }
            .highlight-card {
                width: 96%;
                border-width: 2.5px;
            }
        }
    </style>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js" integrity="sha384-mZLF4UVrpi/QTWPA7BjNPEnkIfRFn4ZEO3Qt/HFklTJBj/gBOV8G3HcKn4NfQblz" crossorigin="anonymous"></script>
</head>
<body class="pos-top">
    <div class="highlight-wrapper">
        <div id="highlight-container" class="hidden"></div>
    </div>

    <script>
        'use strict';

        function getUrlParams() {
            const search = new URLSearchParams(window.location.search);
            const fragment = new URLSearchParams(window.location.hash.slice(1));

            return {
                token: search.get('token') || fragment.get('token') || sessionStorage.getItem('lca.token') || '',
                sessionId: search.get('session') || fragment.get('session') || sessionStorage.getItem('lca.session') || '',
                pos: search.get('pos') || fragment.get('pos') || 'top', // 'top', 'center', 'bottom'
                size: search.get('size') || fragment.get('size') || '',   // 'sm', 'md', 'lg', 'xl', '2x', '9:16'
                scale: search.get('scale') || fragment.get('scale') || '', // e.g. 1.5, 2.0
                theme: search.get('theme') || fragment.get('theme') || 'dark'
                , overlay: search.get('overlay') || fragment.get('overlay') || 'highlight'
            };
        }

        const params = getUrlParams();
        if (params.token) sessionStorage.setItem('lca.token', params.token);
        if (params.sessionId) sessionStorage.setItem('lca.session', params.sessionId);
        if (window.location.hash) history.replaceState(null, '', window.location.pathname + window.location.search);

        // Apply position
        document.body.className = `pos-${params.pos}`;

        // Apply Scale / Size
        if (params.scale) {
            document.documentElement.style.setProperty('--ui-scale', params.scale);
        } else if (params.size) {
            const sizeMap = {
                'sm': '0.85',
                'md': '1.0',
                'lg': '1.35',
                'xl': '1.65',
                '2x': '2.0',
                'vertical': '1.6',
                '9:16': '1.6'
            };
            if (sizeMap[params.size]) {
                document.documentElement.style.setProperty('--ui-scale', sizeMap[params.size]);
            }
        }

        function element(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = String(text);
            return node;
        }

        function safeAvatar(value, author) {
            try {
                const parsed = new URL(value || '');
                if (parsed.protocol === 'http:' || parsed.protocol === 'https:') return parsed.href;
            } catch (_error) {}
            return 'https://ui-avatars.com/api/?name=' + encodeURIComponent(author) + '&background=random&size=128';
        }

        const youtubeEmojiNames = { face_with_tears_of_joy:'😂', rolling_on_the_floor_laughing:'🤣', drooling_face:'🤤', joy:'😂', laughing:'😆', smiling_face_with_heart_eyes:'😍', heart_eyes:'😍', winking_face:'😉', blush:'😊', thinking_face:'🤔', pleading_face:'🥺', sob:'😭', fire:'🔥', red_heart:'❤️', heart:'❤️', thumbs_up:'👍', clap:'👏', pray:'🙏', waving_hand:'👋', skull:'💀', poop:'💩', party_popper:'🎉', hundred_points:'💯', eyes:'👀', sparkles:'✨' };
        const renderComment = (text) => String(text || '').replace(/:([a-z0-9_+-]+):/gi, (match, name) => youtubeEmojiNames[name.toLowerCase()] || match);

        const socket = io({ auth: { token: params.token, sessionId: params.sessionId } });
        const container = document.getElementById('highlight-container');

        socket.on('overlay_scale', (payload) => {
            if (payload && payload.overlay === params.overlay) {
                document.documentElement.style.setProperty('--ui-scale', String(payload.scale));
            }
        });

        socket.on('highlight_message', (data) => {
            if (data.action === 'clear') {
                if (!container.classList.contains('hidden')) {
                    container.classList.add('hide');
                    setTimeout(() => {
                        container.className = 'hidden';
                        container.replaceChildren();
                    }, 350);
                }
                return;
            }

            const msg = data.msg;
            if (!msg) return;

            container.className = 'highlight-card p-6 md:p-8 flex items-start gap-5 md:gap-7 shadow-2xl';
            container.replaceChildren();

            // Avatar container with badge
            const avatarWrap = element('div', 'relative shrink-0');
            const avatar = element('img', 'w-20 h-20 md:w-24 md:h-24 rounded-full object-cover border-2 border-white/30 shadow-xl bg-black/40');
            avatar.src = safeAvatar(msg.avatar, msg.author);
            avatar.alt = String(msg.author);
            avatar.addEventListener('error', () => { avatar.src = safeAvatar('', msg.author); }, { once: true });

            // Platform mini indicator on avatar
            const platformIcon = element('div', 'absolute -bottom-1 -right-1 w-7 h-7 rounded-full flex items-center justify-center border-2 border-[#0c0c10] shadow-md ' +
                (msg.platform === 'youtube' ? 'bg-red-600 text-white' : 'bg-[#00F2FE] text-black font-black text-[10px]'));

            if (msg.platform === 'youtube') {
                const svgNamespace = 'http://www.w3.org/2000/svg';
                const icon = document.createElementNS(svgNamespace, 'svg');
                icon.setAttribute('class', 'w-4 h-4');
                icon.setAttribute('fill', 'currentColor');
                icon.setAttribute('viewBox', '0 0 24 24');
                const iconPath = document.createElementNS(svgNamespace, 'path');
                iconPath.setAttribute('d', 'M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z');
                icon.append(iconPath);
                platformIcon.append(icon);
            } else {
                platformIcon.textContent = 'TT';
            }
            avatarWrap.append(avatar, platformIcon);

            // Content
            const content = element('div', 'flex-1 min-w-0 pt-0.5');

            // Meta Row (Author Name, Platform Badge, Channel)
            const meta = element('div', 'flex flex-wrap items-center gap-2.5 mb-2.5');
            const authorName = element('span', 'font-black text-2xl md:text-3xl text-white tracking-tight text-glow', msg.author);

            const badgeColor = msg.platform === 'youtube'
                ? 'bg-red-500/20 text-red-400 border-red-500/40'
                : 'bg-cyan-500/20 text-cyan-300 border-cyan-500/40';

            const badge = element('span', 'text-xs md:text-sm uppercase font-extrabold px-2.5 py-0.5 rounded-lg border tracking-wider ' + badgeColor, msg.platform);
            meta.append(authorName, badge);

            // Message Comment
            const comment = element('p', 'text-2xl md:text-3xl lg:text-4xl text-white font-bold leading-snug break-words text-glow', renderComment(msg.comment));

            content.append(meta, comment);
            container.append(avatarWrap, content);
        });
    </script>
</body>
</html>
