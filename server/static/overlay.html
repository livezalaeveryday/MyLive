<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chat Overlay</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        yt: '#FF0000',
                        tt: '#00F2FE',
                        tiktok: '#00F2FE',
                        accent: '#8B5CF6'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --ui-scale: 1;
        }

        body {
            background-color: transparent !important;
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 1.5rem;
            box-sizing: border-box;
        }

        .chat-list {
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%);
            zoom: var(--ui-scale);
        }

        .chat-message {
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            background: rgba(14, 14, 18, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (max-aspect-ratio: 1/1), (orientation: portrait) {
            :root {
                --ui-scale: 1.3;
            }
            .chat-message {
                max-width: 90vw !important;
            }
        }
    </style>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js" integrity="sha384-mZLF4UVrpi/QTWPA7BjNPEnkIfRFn4ZEO3Qt/HFklTJBj/gBOV8G3HcKn4NfQblz" crossorigin="anonymous"></script>
</head>
<body class="h-screen w-screen relative flex flex-col justify-end">
    <div class="w-full h-full flex flex-col justify-end chat-list">
        <div id="overlay-chat" class="flex flex-col gap-3 justify-end items-start"></div>
    </div>

    <script>
        'use strict';

        function getUrlParams() {
            const search = new URLSearchParams(window.location.search);
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            return {
                token: search.get('token') || fragment.get('token') || sessionStorage.getItem('lca.token') || '',
                sessionId: search.get('session') || fragment.get('session') || sessionStorage.getItem('lca.session') || '',
                size: search.get('size') || fragment.get('size') || '',
                scale: search.get('scale') || fragment.get('scale') || ''
                , overlay: search.get('overlay') || fragment.get('overlay') || 'chat'
            };
        }

        const params = getUrlParams();
        if (params.token) sessionStorage.setItem('lca.token', params.token);
        if (params.sessionId) sessionStorage.setItem('lca.session', params.sessionId);
        if (window.location.hash) history.replaceState(null, '', window.location.pathname + window.location.search);

        if (params.scale) {
            document.documentElement.style.setProperty('--ui-scale', params.scale);
        } else if (params.size) {
            const sizeMap = { 'sm': '0.85', 'md': '1.0', 'lg': '1.3', 'xl': '1.6', '2x': '2.0', 'vertical': '1.4' };
            if (sizeMap[params.size]) document.documentElement.style.setProperty('--ui-scale', sizeMap[params.size]);
        }

        function element(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = String(text);
            return node;
        }

        function safeAvatar(value, author) {
            try {
                const parsed = new URL(value || '');
                if (parsed.protocol === 'http:' || parsed.protocol === 'https:') return parsed.href;
            } catch (_error) {}
            return 'https://ui-avatars.com/api/?name=' + encodeURIComponent(author) + '&background=random&size=64';
        }

        const youtubeEmojiNames = { face_with_tears_of_joy:'😂', rolling_on_the_floor_laughing:'🤣', drooling_face:'🤤', joy:'😂', laughing:'😆', smiling_face_with_heart_eyes:'😍', heart_eyes:'😍', winking_face:'😉', blush:'😊', thinking_face:'🤔', pleading_face:'🥺', sob:'😭', fire:'🔥', red_heart:'❤️', heart:'❤️', thumbs_up:'👍', clap:'👏', pray:'🙏', waving_hand:'👋', skull:'💀', poop:'💩', party_popper:'🎉', hundred_points:'💯', eyes:'👀', sparkles:'✨' };
        const renderComment = (text) => String(text || '').replace(/:([a-z0-9_+-]+):/gi, (match, name) => youtubeEmojiNames[name.toLowerCase()] || match);

        const socket = io({ auth: { token: params.token, sessionId: params.sessionId } });
        const chatContainer = document.getElementById('overlay-chat');

        socket.on('overlay_scale', (payload) => {
            if (payload && payload.overlay === params.overlay) {
                document.documentElement.style.setProperty('--ui-scale', String(payload.scale));
            }
        });

        socket.on('chat_message', (msg) => {
            const item = element('div', 'chat-message p-3.5 rounded-xl flex gap-3.5 shadow-xl max-w-md w-auto');

            const badgeColor = msg.platform === 'youtube' ? 'bg-red-500' : 'bg-[#00F2FE]';
            const avatarWrap = element('div', 'relative shrink-0');
            const avatar = element('img', 'w-10 h-10 rounded-full object-cover border border-white/20');
            avatar.src = safeAvatar(msg.avatar, msg.author);
            avatar.alt = String(msg.author);
            avatar.addEventListener('error', () => { avatar.src = safeAvatar('', msg.author); }, { once: true });

            avatarWrap.append(avatar, element('div', 'absolute -bottom-1 -right-1 w-4 h-4 rounded-full border-2 border-[#0e0e12] ' + badgeColor));

            const content = element('div', 'flex-1 min-w-0');
            const meta = element('div', 'flex items-center gap-2 mb-0.5');
            meta.append(
                element('div', 'font-bold text-sm text-gray-100 truncate', msg.author),
                element('div', 'text-[10px] uppercase font-bold tracking-wider text-gray-400 bg-white/10 px-1.5 py-0.5 rounded', msg.platform)
            );

            content.append(meta, element('p', 'text-base text-gray-100 font-medium mt-0.5 leading-snug break-words break-all', renderComment(msg.comment)));
            item.append(avatarWrap, content);
            chatContainer.appendChild(item);

            setTimeout(() => {
                if (chatContainer.contains(item)) {
                    item.style.opacity = '0';
                    item.style.transform = 'translateY(10px)';
                    item.style.transition = 'all 0.3s ease';
                    setTimeout(() => item.remove(), 300);
                }
            }, 20000);

            if (chatContainer.children.length > 15) {
                chatContainer.firstChild.remove();
            }
        });
    </script>
</body>
</html>
